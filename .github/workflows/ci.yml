# Runs the typecheck, the module-boundary check, the tests, and the
# nukadoko scenario on every push to main or queue and on pull requests.
# Boundary: reads only. publish.yml is the workflow that publishes.
name: CI

on:
  push:
    branches: [main, queue]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          # Installs from the lockfile only, so no cache from another workflow takes part.
          package-manager-cache: false
      - run: npm ci
      - run: npm run archstrict
      - run: npm test
      - run: npm run test:scenarios
